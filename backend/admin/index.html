<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MYRA Admin</title>
<style>
  :root { --bg:#12001a; --card:#1d0628; --pink:#ff4fd8; --soft:#ffb8f2; --txt:#fff2fc; --line:#6b1f66; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:radial-gradient(circle at top,#3a0b47,#12001a 60%); color:var(--txt); min-height:100vh; }
  h1,h2 { margin:0 0 12px; text-shadow:0 0 12px #ff2bd6; }
  .wrap { max-width:980px; margin:0 auto; padding:18px; }
  .card { background:var(--card); border:1px solid var(--pink); border-radius:16px; padding:18px; margin-bottom:18px; box-shadow:0 0 18px #ff2bd633; }
  input,select,textarea { width:100%; padding:11px 12px; margin:6px 0 12px; border-radius:10px; border:1px solid var(--line); background:#0e0014; color:var(--txt); font-size:15px; }
  label { font-size:13px; color:var(--soft); }
  button { background:linear-gradient(90deg,#ff4fd8,#b01e9e); color:#fff; border:0; border-radius:12px; padding:10px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--pink); }
  button.danger { background:#a3123a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hidden { display:none !important; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#2a0838; border-radius:12px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:26px; color:var(--pink); }
  .row { display:flex; gap:12px; align-items:center; border-top:1px solid var(--line); padding:12px 0; flex-wrap:wrap; }
  .row img { width:56px; height:100px; object-fit:cover; border-radius:8px; background:#000; }
  .row .info { flex:1; min-width:180px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--pink); margin-left:6px; }
  .tag.live { background:#12663a; border-color:#22e06b; }
  .bar { height:8px; background:#0e0014; border-radius:6px; overflow:hidden; margin:4px 0; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ff4fd8,#ffb8f2); }
  .msg { color:var(--soft); font-size:14px; min-height:20px; }
  .err { color:#ff7d9a; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="card" style="max-width:420px;margin:12vh auto 0">
    <h1>MYRA Admin</h1>
    <p class="msg">Sirf authorized administrators.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <p id="loginMsg" class="msg err"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="appView" class="hidden">
    <div class="top"><h1>MYRA Wallpaper Admin</h1><div><span id="who" class="msg"></span> <button class="ghost" id="logoutBtn">Logout</button></div></div>

    <div class="card"><h2>Statistics</h2>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b>Wallpapers</div>
        <div class="stat"><b id="stLive">0</b>Published</div>
        <div class="stat"><b id="stSets">0</b>Total sets</div>
        <div class="stat"><b id="stViews">0</b>Total views</div>
      </div>
    </div>

    <div class="card"><h2 id="formTitle">Upload new wallpaper</h2>
      <label>Title</label><input id="fTitle" maxlength="80">
      <label>Description</label><textarea id="fDesc" rows="3" maxlength="400"></textarea>
      <label>Category</label>
      <select id="fCat"><option>Neon</option><option>Nature</option><option>Abstract</option><option>Anime</option><option>Romantic</option><option>Cars</option><option>Space</option><option>General</option></select>
      <label>Video (mp4, vertical 9:16 recommended, max 150 MB)</label><input id="fVideo" type="file" accept="video/mp4,video/*">
      <label>Thumbnail (jpg / png)</label><input id="fThumb" type="file" accept="image/*">
      <label><input id="fPublish" type="checkbox" style="width:auto;margin-right:8px">Publish immediately</label>
      <div class="bar"><i id="barVideo"></i></div><div class="bar"><i id="barThumb"></i></div>
      <p id="upMsg" class="msg"></p>
      <button id="saveBtn">Upload &amp; save</button>
      <button id="cancelEdit" class="ghost hidden">Cancel edit</button>
    </div>

    <div class="card"><h2>Wallpapers</h2><div id="list"></div></div>
  </div>
</div>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
let unsub = null, editing = null, items = [];

// ---- AUTH: password check happens on Firebase's servers; admin rights are checked by the security rules ----
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch (e) { $("loginMsg").textContent = "Login failed. Email/password check karein."; }
};
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { show(false); return; }
  if ((user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    await signOut(auth);
    $("loginMsg").textContent = "Ye account admin nahi hai.";
    show(false); return;
  }
  $("who").textContent = user.email;
  show(true);
  unsub = onSnapshot(query(collection(db, "wallpapers")), snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    render();
  }, err => { $("upMsg").textContent = "Database error: " + err.code; });
});

function show(isAdmin) {
  $("loginView").classList.toggle("hidden", isAdmin);
  $("appView").classList.toggle("hidden", !isAdmin);
}

// ---- LIST + STATS ----
function render() {
  $("stTotal").textContent = items.length;
  $("stLive").textContent = items.filter(i => i.published).length;
  $("stSets").textContent = items.reduce((s, i) => s + (i.downloads || 0), 0);
  $("stViews").textContent = items.reduce((s, i) => s + (i.views || 0), 0);
  const list = $("list"); list.textContent = "";
  if (!items.length) { list.textContent = "Abhi koi wallpaper nahi."; return; }
  for (const w of items) {
    const row = document.createElement("div"); row.className = "row";
    const img = document.createElement("img"); img.src = w.thumbUrl || ""; row.appendChild(img);
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("b"); t.textContent = w.title || "(untitled)"; info.appendChild(t);
    const tag = document.createElement("span"); tag.className = "tag" + (w.published ? " live" : ""); tag.textContent = w.published ? "PUBLISHED" : "DRAFT"; info.appendChild(tag);
    const meta = document.createElement("div"); meta.className = "msg";
    meta.textContent = `${w.category || ""} · ${((w.sizeBytes||0)/1048576).toFixed(1)} MB · ${w.downloads||0} sets · ${w.views||0} views`; info.appendChild(meta);
    row.appendChild(info);
    row.appendChild(btn(w.published ? "Unpublish" : "Publish", "ghost", () => updateDoc(doc(db, "wallpapers", w.id), { published: !w.published })));
    row.appendChild(btn("Edit", "ghost", () => startEdit(w)));
    row.appendChild(btn("Delete", "danger", () => removeItem(w)));
    list.appendChild(row);
  }
}
function btn(label, cls, fn) { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = fn; return b; }

// ---- UPLOAD / EDIT ----
function startEdit(w) {
  editing = w;
  $("formTitle").textContent = "Edit wallpaper";
  $("fTitle").value = w.title || ""; $("fDesc").value = w.description || ""; $("fCat").value = w.category || "General";
  $("fPublish").checked = !!w.published; $("saveBtn").textContent = "Save changes";
  $("cancelEdit").classList.remove("hidden");
  $("upMsg").textContent = "Nayi video/thumbnail chunein sirf agar replace karni ho.";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("cancelEdit").onclick = resetForm;
function resetForm() {
  editing = null; $("formTitle").textContent = "Upload new wallpaper"; $("saveBtn").textContent = "Upload & save";
  $("cancelEdit").classList.add("hidden");
  for (const id of ["fTitle", "fDesc", "fVideo", "fThumb"]) $(id).value = "";
  $("fPublish").checked = false; $("barVideo").style.width = "0"; $("barThumb").style.width = "0";
}

function upload(file, path, bar) {
  return new Promise((resolve, reject) => {
    const task = uploadBytesResumable(ref(storage, path), file, { contentType: file.type });
    task.on("state_changed",
      s => { bar.style.width = (100 * s.bytesTransferred / s.totalBytes).toFixed(0) + "%"; $("upMsg").textContent = `Uploading ${file.name}: ${(100 * s.bytesTransferred / s.totalBytes).toFixed(0)}%`; },
      reject,
      async () => resolve({ url: await getDownloadURL(task.snapshot.ref), path }));
  });
}
const safeName = n => n.replace(/[^a-zA-Z0-9._-]/g, "_");

$("saveBtn").onclick = async () => {
  const title = $("fTitle").value.trim();
  if (!title) { $("upMsg").textContent = "Title zaroori hai."; return; }
  const vf = $("fVideo").files[0], tf = $("fThumb").files[0];
  if (!editing && (!vf || !tf)) { $("upMsg").textContent = "Video aur thumbnail dono chunein."; return; }
  if (vf && vf.size > 150 * 1024 * 1024) { $("upMsg").textContent = "Video 150 MB se chhoti honi chahiye."; return; }
  $("saveBtn").disabled = true; $("upMsg").classList.remove("err");
  try {
    const id = editing ? editing.id : doc(collection(db, "wallpapers")).id;
    const data = { title, description: $("fDesc").value.trim(), category: $("fCat").value, published: $("fPublish").checked };
    if (vf) { const v = await upload(vf, `wallpapers/${id}/${Date.now()}_${safeName(vf.name)}`, $("barVideo")); data.videoUrl = v.url; data.videoPath = v.path; data.sizeBytes = vf.size; }
    if (tf) { const t = await upload(tf, `wallpapers/${id}/thumb_${Date.now()}_${safeName(tf.name)}`, $("barThumb")); data.thumbUrl = t.url; data.thumbPath = t.path; }
    if (editing) {
      await updateDoc(doc(db, "wallpapers", id), data);
      if (vf && editing.videoPath) deleteObject(ref(storage, editing.videoPath)).catch(() => {});
      if (tf && editing.thumbPath) deleteObject(ref(storage, editing.thumbPath)).catch(() => {});
    } else {
      await setDoc(doc(db, "wallpapers", id), { ...data, createdAt: Date.now(), downloads: 0, views: 0 });
    }
    $("upMsg").textContent = data.published ? "Saved & published ✅ (users ke app mein 1 minute ke andar aa jayega)" : "Saved as draft ✅";
    resetForm();
  } catch (e) {
    $("upMsg").classList.add("err"); $("upMsg").textContent = "Failed: " + (e.code || e.message);
  } finally { $("saveBtn").disabled = false; }
};

async function removeItem(w) {
  if (!confirm(`"${w.title}" delete karein? Video aur thumbnail bhi hat jayenge.`)) return;
  try {
    await deleteDoc(doc(db, "wallpapers", w.id));
    for (const p of [w.videoPath, w.thumbPath]) if (p) await deleteObject(ref(storage, p)).catch(() => {});
  } catch (e) { alert("Delete failed: " + (e.code || e.message)); }
}
</script>
</body>
</html>
